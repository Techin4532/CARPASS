<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking System - Web App</title>
    <!-- Tailwind CSS สำหรับจัดแต่งหน้าตาให้สวยงามบนมือถือ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT.js สำหรับเชื่อมต่อกับ KidBright ผ่าน WebSocket -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center font-sans">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
        
        <!-- Header Section -->
        <div class="bg-indigo-600 p-6 text-white text-center relative">
            <h1 class="text-2xl font-extrabold tracking-wide">SMART PARKING</h1>
            <p class="text-indigo-200 text-xs mt-1">ระบบบริหารลานจอดรถดิจิทัล</p>
            
            <!-- Connection Status Badge -->
            <div id="status-badge" class="inline-flex items-center gap-2 mt-3 px-3 py-1 rounded-full bg-indigo-800 text-indigo-200 text-xs font-medium">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span>
                <span id="status-text">กำลังเชื่อมต่อ MQTT Broker...</span>
            </div>
        </div>

        <!-- Tab Selector (สำหรับสลับโหมดทดสอบ) -->
        <div class="flex border-b text-sm font-bold bg-slate-50">
            <button id="tab-in" onclick="switchTab('in')" class="flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600 transition">
                🚪 ขาเข้า (GATE IN)
            </button>
            <button id="tab-out" onclick="switchTab('out')" class="flex-1 py-3 text-slate-400 border-b-2 border-transparent transition">
                🚗 ขาออก (GATE OUT)
            </button>
        </div>

        <!-- Content Area -->
        <div class="p-6 space-y-6">

            <!-- Notification Alert Box -->
            <div id="alert-box" class="hidden p-4 rounded-2xl text-sm font-medium text-center shadow-sm transition-all"></div>

            <!-- ========================================================= -->
            <!-- 1. ฝั่งขาเข้า (GATE IN VIEW) -->
            <!-- ========================================================= -->
            <div id="view-in" class="space-y-5">
                <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl text-center">
                    <span class="text-xs font-bold text-indigo-400 tracking-wider uppercase">สถานะประตูขาเข้า</span>
                    <p id="in-sensor-status" class="text-sm font-semibold text-indigo-900 mt-1">
                        กรุณาขับรถจอดหน้าเซนเซอร์เพื่อรับรหัส
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 text-center">
                        กรอกรหัส OTP 4 หลัก (ดูจากจอ LED บอร์ด)
                    </label>
                    <input type="number" id="input-otp-in" placeholder="0000" maxlength="4"
                        class="w-full py-4 text-center text-3xl font-extrabold text-indigo-600 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none tracking-widest transition">
                </div>

                <button onclick="submitEntry()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-lg rounded-2xl shadow-lg shadow-emerald-200 active:scale-95 transition">
                    ยืนยันรหัส & รับตั๋วเข้าจอด
                </button>
            </div>

            <!-- ========================================================= -->
            <!-- 2. ฝั่งขาออก (GATE OUT VIEW) -->
            <!-- ========================================================= -->
            <div id="view-out" class="space-y-5 hidden">
                
                <!-- บัตรตั๋วจอดรถดิจิทัล -->
                <div class="bg-slate-800 text-white p-5 rounded-2xl shadow-inner space-y-3 relative overflow-hidden">
                    <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-indigo-500 opacity-20 rounded-full blur-xl"></div>
                    
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <span class="text-xs text-slate-400">TICKET ID</span>
                        <span id="ticket-id" class="font-mono text-sm font-bold text-indigo-400">-</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">เวลาที่เข้าจอด:</span>
                        <span id="entry-time" class="font-semibold">-</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400">ระยะเวลาจอดรวม:</span>
                        <span id="park-duration" class="font-semibold text-amber-400">-</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-700">
                        <span class="text-sm font-bold">ค่าบริการทั้งหมด:</span>
                        <span id="park-fee" class="text-2xl font-extrabold text-emerald-400">0 บาท</span>
                    </div>
                </div>

                <!-- ปุ่มชำระเงิน -->
                <button id="btn-pay" onclick="payFee()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl shadow-md transition active:scale-95">
                    💳 ชำระเงินค่าบริการ (จำลองจ่าย)
                </button>

                <div class="pt-2 border-t border-slate-100">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 text-center">
                        กรอกรหัส OTP 4 หลักขาออก (ดูจากจอ LED บอร์ด)
                    </label>
                    <input type="number" id="input-otp-out" placeholder="0000" maxlength="4"
                        class="w-full py-4 text-center text-3xl font-extrabold text-indigo-600 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none tracking-widest transition">
                </div>

                <button onclick="submitExit()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-indigo-200 active:scale-95 transition">
                    ยืนยันออก & เปิดไม้กั้น
                </button>
            </div>

        </div>
    </div>

    <!-- Script ควบคุมการทำงาน -->
    <script>
        // --- ค่าคอนฟิกการเชื่อมต่อ MQTT ---
        const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";
        const CLIENT_ID = "WebPark_" + Math.random().toString(16).substr(2, 8);

        let mqttClient;
        let latestOtpIn = null;
        let latestOtpOut = null;
        let isPaid = false;

        // --- โหลดหน้าเว็บ ---
        window.onload = () => {
            connectMQTT();
            checkUrlGateParam();
            updateExitTicketUI();
        };

        // --- การเชื่อมต่อ MQTT ---
        function connectMQTT() {
            mqttClient = mqtt.connect(MQTT_BROKER, { clientId: CLIENT_ID });

            mqttClient.on('connect', () => {
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-400";
                document.getElementById('status-text').innerText = "เชื่อมต่อระบบเรียบร้อย";

                // Subscribe หัวข้อจาก KidBright
                mqttClient.subscribe("parking/gate_in/detect");
                mqttClient.subscribe("parking/gate_out/detect");
                mqttClient.subscribe("parking/gate_in/status");
                mqttClient.subscribe("parking/gate_out/status");
            });

            mqttClient.on('message', (topic, payload) => {
                try {
                    const data = JSON.parse(payload.toString());
                    
                    // เมื่อ KidBright สุ่ม OTP ขาเข้า
                    if (topic === "parking/gate_in/detect") {
                        latestOtpIn = data.otp;
                        document.getElementById('in-sensor-status').innerText = "พบรถจอดรอ! กรุณากรอกรหัส OTP บนจอ LED";
                        showAlert("พบรถที่ประตูขาเข้า! รหัส OTP พร้อมใช้งาน", "info");
                    }
                    // เมื่อ KidBright สุ่ม OTP ขาออก
                    else if (topic === "parking/gate_out/detect") {
                        latestOtpOut = data.otp;
                        showAlert("พบรถที่ประตูขาออก! กรุณากรอกรหัส OTP ขาออก", "info");
                    }
                    // เมื่อรถขับผ่านพ้นประตู
                    else if (topic === "parking/gate_in/status" && data.status === "CLEARED") {
                        latestOtpIn = null;
                        document.getElementById('in-sensor-status').innerText = "ประตูว่าง (กรุณาขับรถเข้าใกล้เซนเซอร์)";
                    }
                } catch(e) {
                    console.error("MQTT Message Error:", e);
                }
            });
        }

        // --- ระบบขาเข้า (GATE IN) ---
        function submitEntry() {
            const userOtp = document.getElementById('input-otp-in').value;

            if (!latestOtpIn) {
                showAlert("ไม่พบรถจอดรอที่ประตูขาเข้า!", "danger");
                return;
            }
            if (userOtp !== latestOtpIn) {
                showAlert("รหัส OTP ไม่ถูกต้อง! กรุณาดูรหัสบนจอ LED", "danger");
                return;
            }

            // บันทึกสิทธิ์ E-Ticket ลงใน LocalStorage ของมือถือ
            const ticketData = {
                id: "TKT-" + Math.floor(100000 + Math.random() * 900000),
                entryTime: new Date().toISOString()
            };
            localStorage.setItem("parking_ticket", JSON.stringify(ticketData));

            // ส่งสัญญาณ MQTT บอก KidBright ให้ยกไม้กั้น SV1
            mqttClient.publish("parking/gate_in/control", "OPEN");

            showAlert("ยืนยันสำเร็จ! ไม้กั้นเปิดแล้ว ยินดีต้อนรับ", "success");
            document.getElementById('input-otp-in').value = "";
        }

        // --- ระบบขาออก (GATE OUT) ---
        function updateExitTicketUI() {
            const ticketRaw = localStorage.getItem("parking_ticket");
            if (!ticketRaw) {
                document.getElementById('ticket-id').innerText = "ไม่พบตั๋วเข้าจอด";
                document.getElementById('entry-time').innerText = "-";
                document.getElementById('park-duration').innerText = "0 นาที";
                document.getElementById('park-fee').innerText = "0 บาท";
                return;
            }

            const ticket = JSON.parse(ticketRaw);
            const entryDate = new Date(ticket.entryTime);
            const nowDate = new Date();
            
            // คำนวณเวลาจอด (นาที)
            const diffMinutes = Math.max(1, Math.ceil((nowDate - entryDate) / (1000 * 60)));
            
            // อัตราค่าจอด: ฟรี 15 นาทีแรก, เกินจากนั้น คิดชั่วโมงละ 20 บาท
            let fee = 0;
            if (diffMinutes > 15) {
                fee = Math.ceil(diffMinutes / 60) * 20;
            }

            document.getElementById('ticket-id').innerText = ticket.id;
            document.getElementById('entry-time').innerText = entryDate.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('park-duration').innerText = `${diffMinutes} นาที`;
            document.getElementById('park-fee').innerText = `${fee} บาท`;
        }

        function payFee() {
            const ticketRaw = localStorage.getItem("parking_ticket");
            if (!ticketRaw) {
                showAlert("ไม่มีรายการตั๋วให้ชำระเงิน!", "danger");
                return;
            }
            isPaid = true;
            const btnPay = document.getElementById('btn-pay');
            btnPay.innerText = "✓ ชำระเงินเรียบร้อยแล้ว";
            btnPay.className = "w-full py-3 bg-emerald-500 text-white font-bold rounded-2xl shadow-md cursor-default";
            showAlert("ชำระเงินสำเร็จ! กรุณากรอกรหัส OTP ขาออกเพื่อเปิดประตู", "success");
        }

        function submitExit() {
            const userOtp = document.getElementById('input-otp-out').value;
            const ticketRaw = localStorage.getItem("parking_ticket");

            if (!ticketRaw) {
                showAlert("ไม่พบบันทึกตั๋วเข้าจอดในเครื่องของคุณ!", "danger");
                return;
            }
            if (!isPaid) {
                showAlert("กรุณากดชำระเงินค่าบริการก่อนออก!", "danger");
                return;
            }
            if (!latestOtpOut || userOtp !== latestOtpOut) {
                showAlert("รหัส OTP ขาออกไม่ถูกต้อง หรือไม่พบรถหน้าประตู!", "danger");
                return;
            }

            // ส่งสัญญาณ MQTT บอก KidBright ให้ยกไม้กั้น SV2
            mqttClient.publish("parking/gate_out/control", "OPEN");

            // ลบตั๋วออกจากมือถือ
            localStorage.removeItem("parking_ticket");
            showAlert("เปิดไม้กั้นขาออกสำเร็จ! ขอบคุณที่ใช้บริการ", "success");

            setTimeout(() => {
                location.reload();
            }, 2500);
        }

        // --- สลับโหมด UI ---
        function switchTab(mode) {
            const viewIn = document.getElementById('view-in');
            const viewOut = document.getElementById('view-out');
            const tabIn = document.getElementById('tab-in');
            const tabOut = document.getElementById('tab-out');

            if (mode === 'in') {
                viewIn.classList.remove('hidden');
                viewOut.classList.add('hidden');
                tabIn.className = "flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600 transition";
                tabOut.className = "flex-1 py-3 text-slate-400 border-b-2 border-transparent transition";
            } else {
                viewIn.classList.add('hidden');
                viewOut.classList.remove('hidden');
                tabOut.className = "flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600 transition";
                tabIn.className = "flex-1 py-3 text-slate-400 border-b-2 border-transparent transition";
                updateExitTicketUI();
            }
        }

        function checkUrlGateParam() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('gate') === 'out') {
                switchTab('out');
            }
        }

        function showAlert(msg, type) {
            const box = document.getElementById('alert-box');
            box.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-600', 'bg-indigo-50', 'text-indigo-600');
            box.innerText = msg;

            if (type === 'danger') box.classList.add('bg-red-50', 'text-red-600');
            else if (type === 'success') box.classList.add('bg-emerald-50', 'text-emerald-600');
            else box.classList.add('bg-indigo-50', 'text-indigo-600');
        }
    </script>
</body>
</html>
